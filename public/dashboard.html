    <!-- FIREBASE & SCRIPT CONTROL LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, updateDoc, getDocs, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPzmsyUrl1JvXR1HdszidJpewIcEnuzgo",
            authDomain: "soniexchange.firebaseapp.com",
            projectId: "soniexchange",
            storageBucket: "soniexchange.firebasestorage.app",
            messagingSenderId: "731423101248",
            appId: "1:731423101248:web:30a85f0bb04a7155ec2aa5",
            measurementId: "G-BX7NTH157B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = localStorage.getItem("loggedInUser") || "Admin"; 
        let isUserAdmin = (currentUser.toLowerCase() === "admin" || currentUser.toLowerCase() === "superadmin" || currentUser.toLowerCase() === "z9dmo");

        window.addEventListener('DOMContentLoaded', async () => {
            if(!isUserAdmin) {
                // Show Txn Pass Input box for Master/Super creating IDs
                document.getElementById('txnPassContainer').classList.remove('hidden');

                // Check First-Time Login Status in Firebase for regular users
                try {
                    const userDoc = await getDoc(doc(db, "clients", currentUser));
                    if(userDoc.exists()) {
                        const data = userDoc.data();
                        if(data.isPasswordChanged === false) {
                            document.getElementById('changePasswordModal').classList.remove('hidden');
                        }
                    }
                } catch(e) {
                    console.error("Error checking user login status: ", e);
                }
            }
        });

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sportsSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        };

        window.switchTab = function(tab) {
            document.getElementById('viewWelcome').classList.add('hidden');
            document.getElementById('viewListOfClients').classList.add('hidden');
            document.getElementById('viewAddAccount').classList.add('hidden');
            document.getElementById('viewMarketAnalysis').classList.add('hidden');
            document.getElementById('viewAssignAgent').classList.add('hidden');

            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('bg-[#005580]'));

            if(tab === 'clients') {
                document.getElementById('viewListOfClients').classList.remove('hidden');
                document.getElementById('navClients').classList.add('bg-[#005580]');
                renderClientsTable();
            } else if(tab === 'addAccount') {
                document.getElementById('viewAddAccount').classList.remove('hidden');
            } else if(tab === 'assignAgent') {
                document.getElementById('viewAssignAgent').classList.remove('hidden');
                document.getElementById('navAssignAgent').classList.add('bg-[#005580]');
            } else if(tab === 'marketAnalysis') {
                document.getElementById('viewMarketAnalysis').classList.remove('hidden');
                document.getElementById('navMarketAnalysis').classList.add('bg-[#005580]');
            }
        };

        window.validateClientName = function() {
            const input = document.getElementById('clientNameInput');
            const error = document.getElementById('clientNameError');
            const val = input.value;

            if (val.length === 0 || /^[A-Z]/.test(val)) {
                input.classList.remove('border-red-300', 'bg-red-50/20');
                input.classList.add('border-green-400', 'bg-green-50/20');
                error.classList.add('hidden');
                return true;
            } else {
                input.classList.remove('border-green-400', 'bg-green-50/20');
                input.classList.add('border-red-300', 'bg-red-50/20');
                error.classList.remove('hidden');
                return false;
            }
        };

        window.validatePassword = function() {
            const input = document.getElementById('clientPassInput');
            const error = document.getElementById('passwordError');
            const val = input.value;
            const hasCapitalStart = /^[A-Z]/.test(val);
            const hasSpecialChar = /[$¥§€@!#%^&*]/.test(val);

            if (val.length === 0 || (hasCapitalStart && hasSpecialChar)) {
                input.classList.remove('border-red-300', 'bg-red-50/20');
                input.classList.add('border-green-400', 'bg-green-50/20');
                error.classList.add('hidden');
                return true;
            } else {
                input.classList.remove('border-green-400', 'bg-green-50/20');
                input.classList.add('border-red-300', 'bg-red-50/20');
                error.classList.remove('hidden');
                return false;
            }
        };

        window.handleFirstTimePasswordChange = async function(event) {
            event.preventDefault();
            const newPass = document.getElementById('modalNewPassword').value;
            const confirmPass = document.getElementById('modalConfirmPassword').value;

            if(newPass !== confirmPass) {
                alert("Passwords do not match!");
                return;
            }

            try {
                const txnPass = Math.floor(100000 + Math.random() * 900000).toString();

                await updateDoc(doc(db, "clients", currentUser), {
                    password: newPass,
                    transactionPassword: txnPass,
                    isPasswordChanged: true
                });

                document.getElementById('changePasswordModal').classList.add('hidden');
                document.getElementById('generatedTxnPass').innerText = txnPass;
                document.getElementById('generatedTxnPassHindi').innerText = txnPass;
                document.getElementById('txnPasswordDisplayScreen').classList.remove('hidden');

            } catch (e) {
                console.error("Error updating password: ", e);
                alert("Error: " + e.message);
            }
        };

        window.handleCreateAccount = async function(event) {
            event.preventDefault();

            if (!validateClientName() || !validatePassword()) {
                alert("Please correct the Client Name and Password according to the rules!");
                return;
            }

            if(!isUserAdmin) {
                const userTxnPass = document.getElementById('clientTxnPassInput').value.trim();
                const userDoc = await getDoc(doc(db, "clients", currentUser));
                if(!userDoc.exists() || userDoc.data().transactionPassword !== userTxnPass) {
                    alert("Invalid 6-Digit Transaction Password!");
                    return;
                }
            }

            const btn = document.getElementById('btnCreateAccount');
            let username = document.getElementById('clientNameInput').value.trim();
            let pass = document.getElementById('clientPassInput').value;
            let retypePass = document.getElementById('retypePassInput').value;
            let creditRef = parseFloat(document.getElementById('clientCreditRef').value) || 0;
            let accType = document.getElementById('clientAccountType').value;
            let fullName = document.getElementById('fullNameInput').value.trim();
            let city = document.getElementById('cityInput').value.trim();
            let phone = document.getElementById('phoneInput').value.trim();

            if(pass !== retypePass) {
                alert("Passwords do not match!");
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = "Creating...";

                const docRef = doc(db, "clients", username);
                const docSnap = await getDoc(docRef);

                if(docSnap.exists()) {
                    alert("Client username already exists in SoniExchange database!");
                    btn.disabled = false;
                    btn.innerText = "CREATE ACCOUNT";
                    return;
                }

                await setDoc(docRef, {
                    username: username,
                    password: pass,
                    creditRef: creditRef,
                    accType: accType || 'User',
                    fullName: fullName,
                    city: city,
                    phone: phone,
                    isPasswordChanged: false, 
                    transactionPassword: "",
                    createdBy: currentUser,
                    createdAt: serverTimestamp()
                });

                alert("Account '" + username + "' created successfully in Firestore!");
                document.getElementById('addAccountForm').reset();
                switchTab('clients');

            } catch (error) {
                console.error("Error creating account: ", error);
                alert("Firebase Error: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "CREATE ACCOUNT";
            }
        };

        window.resetSearch = function() {
            document.getElementById('clientSearchInput').value = "";
            renderClientsTable();
        };

        window.renderClientsTable = async function() {
            let tbody = document.getElementById('clientTableBody');
            let searchQuery = document.getElementById('clientSearchInput') ? document.getElementById('clientSearchInput').value.toLowerCase().trim() : "";

            tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-gray-500 font-semibold"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading accounts...</td></tr>`;

            try {
                const querySnapshot = await getDocs(collection(db, "clients"));
                let clients = [];

                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    // ADMIN sees ALL accounts, Super/Master see only their created accounts
                    if (isUserAdmin || data.createdBy === currentUser) {
                        clients.push({ id: doc.id, ...data });
                    }
                });

                if(searchQuery) {
                    clients = clients.filter(c => c.username && c.username.toLowerCase().includes(searchQuery));
                }

                if(clients.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-gray-400">No accounts found. Click 'Add Account' to create one.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                clients.forEach((client) => {
                    let formattedCr = (parseFloat(client.creditRef) || 0).toLocaleString();
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 border-b border-gray-200">
                            <td class="p-2 border-r border-gray-200">
                                <span class="bg-[#3a3a3a] text-white px-2.5 py-1 rounded font-bold inline-block text-[11px]">${client.username}</span>
                            </td>
                            <td class="p-2 border-r border-gray-200 font-semibold">${formattedCr}</td>
                            <td class="p-2 border-r border-gray-200 text-center"><input type="checkbox" checked class="accent-black w-3.5 h-3.5"></td>
                            <td class="p-2 border-r border-gray-200 text-center"><input type="checkbox" checked class="accent-black w-3.5 h-3.5"></td>
                            <td class="p-2 border-r border-gray-200">${formattedCr}</td>
                            <td class="p-2 border-r border-gray-200">0</td>
                            <td class="p-2 border-r border-gray-200">${client.accType || 'User'}</td>
                            <td class="p-2 text-center whitespace-nowrap">
                                <div class="inline-flex space-x-1">
                                    <button class="action-btn">D</button>
                                    <button class="action-btn">W</button>
                                    <button class="action-btn">L</button>
                                    <button class="action-btn">C</button>
                                    <button class="action-btn">P</button>
                                    <button class="action-btn">S</button>
                                    <button class="action-btn">MORE</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error loading accounts: ", error);
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500 font-bold">Failed to load accounts.</td></tr>`;
            }
        };
    </script>

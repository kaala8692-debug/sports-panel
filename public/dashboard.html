<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soni Exchange - Admin Panel</title>
    <!-- Tailwind CSS for Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; }
        .top-navbar { background-color: #0088cc; color: white; }
        .nav-item { cursor: pointer; padding: 6px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .nav-item:hover, .nav-item.active { background-color: #006699; }
        .sidebar { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body class="relative min-h-screen flex flex-col">

    <!-- Top Blue Exchange Navbar (Completed & Locked) -->
    <header class="top-navbar flex items-center justify-between px-3 py-1.5 shadow-md sticky top-0 z-40">
        <div class="flex items-center space-x-3 overflow-x-auto">
            <!-- Original Circular Soni Logo with Zoom Modal -->
            <div onclick="openLogoModal()" class="cursor-pointer flex items-center space-x-1.5 group" title="Click to View Logo">
                <div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-sm text-white shadow-md transition-transform duration-300 group-hover:scale-110">
                    S
                </div>
                <span class="font-extrabold tracking-wider text-sm text-white">SONI</span>
            </div>

            <!-- 3-Line Menu Icon -->
            <button onclick="toggleSidebar()" class="text-white hover:text-yellow-300 text-lg px-2 focus:outline-none">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Menu Navigation Links -->
            <nav class="flex items-center space-x-1 text-xs">
                <span onclick="switchTab('clients')" class="nav-item rounded">List of Clients</span>
                <span onclick="switchTab('assignAgent')" class="nav-item rounded">Assign Agent</span>
                <span onclick="switchTab('marketAnalysis')" class="nav-item rounded font-bold bg-blue-800">Market Analysis</span>
                <span class="nav-item rounded">Live Market <i class="fa-solid fa-caret-down text-[10px]"></i></span>
                <span class="nav-item rounded">Live Virtual Market <i class="fa-solid fa-caret-down text-[10px]"></i></span>
                <span class="nav-item rounded">Reports <i class="fa-solid fa-caret-down text-[10px]"></i></span>
                <span class="nav-item rounded">Multi Login</span>
            </nav>
        </div>

        <!-- Right Side User & Search Box -->
        <div class="flex items-center space-x-2 text-xs">
            <span class="font-semibold hidden sm:inline">SuperAdmin <i class="fa-solid fa-caret-down"></i></span>
            <div class="relative">
                <input type="text" placeholder="All Client" class="px-2 py-1 text-black text-xs rounded border border-gray-300 w-28 sm:w-36 focus:outline-none">
                <button class="absolute right-1 top-1 text-gray-500"><i class="fa-solid fa-magnifying-glass text-xs"></i></button>
            </div>
        </div>
    </header>

    <!-- Sub Header Bar -->
    <div id="subHeaderBar" class="bg-white border-b border-gray-200 px-4 py-2 flex justify-between items-center text-sm shadow-sm">
        <div class="flex items-center space-x-2 font-bold text-gray-700">
            <span id="subHeaderTitle">Market Analysis</span>
            <i class="fa-solid fa-rotate text-xs cursor-pointer hover:text-blue-600" title="Refresh"></i>
        </div>
        <div id="subHeaderRight" class="w-64">
            <input type="text" placeholder="Search Event" class="w-full px-2 py-1 text-xs border border-gray-300 rounded focus:outline-none">
        </div>
    </div>

    <!-- Main Content Body -->
    <main class="flex-1 p-4 space-y-4">
        
        <!-- Market Analysis View (Default) -->
        <div id="viewMarketAnalysis" class="space-y-4">
            <!-- Market content placeholder -->
        </div>

        <!-- List of Clients View -->
        <div id="viewListOfClients" class="hidden space-y-3">
            
            <!-- Total Distributed CR Summary Box -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="bg-white p-3 rounded border border-gray-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Total Distributed CR</p>
                        <p id="totalCrDisplay" class="text-lg font-bold text-blue-700">0 pts</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                </div>
                <div class="bg-white p-3 rounded border border-gray-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-500 font-semibold uppercase tracking-wider">Total Active Clients</p>
                        <p id="totalClientsDisplay" class="text-lg font-bold text-emerald-600">0</p>
                    </div>

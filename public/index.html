<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soni Exchange - Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0088cc; font-family: Arial, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6 relative mt-6">
        <!-- Logo Circle -->
        <div class="absolute -top-12 left-1/2 transform -translate-x-1/2">
            <div class="w-20 h-20 rounded-full bg-slate-900 border-4 border-white flex items-center justify-center shadow-lg font-bold text-white text-2xl">
                S
            </div>
        </div>

        <div class="pt-8 text-center space-y-4">
            <h2 class="font-bold text-gray-700 text-base border-b pb-2 tracking-wide">Sign In</h2>
            
            <form onsubmit="handleLogin(event)" class="space-y-3 text-left text-xs">
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Username / Client ID:</label>
                    <input type="text" id="loginUser" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500" placeholder="Username">
                </div>
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Password:</label>
                    <input type="password" id="loginPass" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500" placeholder="********">
                </div>
                <button type="submit" class="w-full bg-[#0077b3] hover:bg-[#006699] text-white font-bold py-2.5 rounded shadow transition text-sm">
                    Login &rarr;
                </button>
            </form>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            let u = document.getElementById('loginUser').value.trim();
            let p = document.getElementById('loginPass').value;

            // Purana simple login check jo pehle tha
            if((u === 'admin' && p === '123') || (u === 'Soniexchange')) {
                window.location.href = 'dashboard.html';
            } else {
                alert("Galat Username ya Password hai!");
            }
        }
    </script>
</body>
</html>

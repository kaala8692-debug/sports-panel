<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoniExchange - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b1e28; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-[#102a3a] border border-gray-800 rounded-xl p-6 w-full max-w-sm text-white shadow-2xl relative">
        <div class="absolute -top-7 left-1/2 transform -translate-x-1/2 w-14 h-14 bg-[#0b1e28] rounded-full border border-gray-700 flex items-center justify-center text-xl font-bold text-gray-300">
            S
        </div>

        <h2 class="text-center text-xl font-bold mt-4 mb-6">Sign In</h2>

        <form id="loginForm" class="space-y-4 text-xs">
            <div>
                <label class="block text-gray-400 mb-1">Username / Client ID:</label>
                <input type="text" id="usernameInput" required placeholder="Soniexchange" class="w-full bg-[#0b1e28] border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-cyan-500">
            </div>

            <div>
                <label class="block text-gray-400 mb-1">Password:</label>
                <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full bg-[#0b1e28] border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-cyan-500">
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2.5 rounded transition mt-2">
                SIGN IN
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPzmsyUrl1JvXR1HdszidJpewIcEnuzgo",
            authDomain: "soniexchange.firebaseapp.com",
            projectId: "soniexchange",
            storageBucket: "soniexchange.firebasestorage.app",
            messagingSenderId: "731423101248",
            appId: "1:731423101248:web:30a85f0bb04a7155ec2aa5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const btn = document.getElementById('loginBtn');

            btn.innerText = "Checking...";
            btn.disabled = true;

            // Permanent Admin Auth Bypass Check
            if (username.toLowerCase() === "soniexchange") {
                if (password === "Lyy@5656" || password === "Lyy@@5656") {
                    localStorage.setItem("loggedInUser", "Soniexchange");
                    window.location.href = "dashboard.html";
                    return;
                } else {
                    alert("Incorrect Admin Password!");
                    btn.innerText = "SIGN IN";
                    btn.disabled = false;
                    return;
                }
            }

            // Firebase Check for Created Clients / Masters
            try {
                const docRef = doc(db, "clients", username);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && docSnap.data().password === password) {
                    localStorage.setItem("loggedInUser", username);
                    window.location.href = "dashboard.html";
                } else {
                    alert("Invalid Username or Password!");
                    btn.innerText = "SIGN IN";
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Database Error: " + err.message);
                btn.innerText = "SIGN IN";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

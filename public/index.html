<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soni Exchange - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b3c5d;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- LOGIN CONTAINER -->
    <div class="w-full max-w-sm bg-[#1d2731]/80 backdrop-blur-md rounded-2xl shadow-2xl p-6 text-white border border-gray-700 relative">
        
        <!-- LOGO ICON -->
        <div class="w-16 h-16 bg-[#0b3c5d] rounded-full flex items-center justify-center mx-auto -mt-14 border-4 border-[#0b3c5d] shadow-lg">
            <span class="text-2xl font-black text-white">S</span>
        </div>

        <h2 class="text-center font-bold text-lg mt-3 mb-6 tracking-wide">Sign In</h2>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Username / Client ID:</label>
                <input type="text" id="loginUsername" required placeholder="Enter Username" class="w-full px-3 py-2 bg-slate-800/80 border border-gray-600 rounded text-xs text-white focus:outline-none focus:border-cyan-400">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Password:</label>
                <input type="password" id="loginPassword" required placeholder="Enter Password" class="w-full px-3 py-2 bg-slate-800/80 border border-gray-600 rounded text-xs text-white focus:outline-none focus:border-cyan-400">
            </div>

            <button type="submit" id="btnLogin" class="w-full bg-[#0088cc] hover:bg-[#006699] font-bold py-2.5 rounded-lg text-xs uppercase tracking-wider shadow-lg transition">
                Login &rarr;
            </button>
        </form>
    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPzmsyUrl1JvXR1HdszidJpewIcEnuzgo",
            authDomain: "soniexchange.firebaseapp.com",
            projectId: "soniexchange",
            storageBucket: "soniexchange.firebasestorage.app",
            messagingSenderId: "731423101248",
            appId: "1:731423101248:web:30a85f0bb04a7155ec2aa5",
            measurementId: "G-BX7NTH157B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleLogin = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const usernameInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value.trim();

            btn.disabled = true;
            btn.innerText = "Checking...";

            // ADMIN DIRECT ACCESS
            if(usernameInput.toLowerCase() === "admin" && passwordInput === "Admin@123") {
                localStorage.setItem("loggedInUser", "Admin");
                window.location.href = "dashboard.html";
                return;
            }

            try {
                // Fetch direct Document by username (Doc ID: Kalu123)
                const docRef = doc(db, "clients", usernameInput);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    
                    if (userData.password === passwordInput) {
                        localStorage.setItem("loggedInUser", usernameInput);
                        // Redirect to Dashboard
                        window.location.href = "dashboard.html";
                    } else {
                        alert("Galat Password! Sahi password daalein.");
                    }
                } else {
                    alert("Client ID nahi mili! Kripya Username sahi check karein.");
                }
            } catch (err) {
                console.error("Login Error: ", err);
                alert("Login Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Login \u2192";
            }
        };
    </script>
</body>
</html>

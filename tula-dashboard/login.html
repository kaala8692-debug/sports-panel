<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TULA111 - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #2c4c54 0%, #1e353b 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .logo {
            font-size: 52px;
            font-weight: bold;
            font-style: italic;
            color: #ffffff;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .login-box {
            background-color: #ffffff;
            width: 90%;
            max-width: 360px;
            border-radius: 4px;
            padding: 20px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
            box-sizing: border-box;
            text-align: center;
        }
        .login-box h3 {
            margin-top: 0;
            color: #1e353b;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-group input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #f9f9f9;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #2c4c54;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-demo {
            background-color: #1e353b;
        }
        .footer-links {
            position: absolute;
            bottom: 60px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 14px;
        }
        .footer-links a {
            color: #ffffff;
            text-decoration: underline;
        }
        .support-text {
            position: absolute;
            bottom: 20px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="logo">TULA111</div>

    <div class="login-box">
        <h3>Login 👤</h3>
        
        <div class="input-group">
            <input type="text" id="username" placeholder="Username">
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Password">
        </div>
        
        <button class="btn" onclick="performLogin()">Login ➜</button>
        <button class="btn btn-demo" onclick="alert('डेमो आईडी: demo123, पासवर्ड: 123')">Login with demo ID ➜</button>
    </div>

    <div class="footer-links">
        <a href="/terms">Terms and Conditions</a>
        <a href="#">Responsible Gaming</a>
    </div>

    <div class="support-text">24X7 Support</div>

    <script>
        function performLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (!user || !pass) return alert("कृपया यूजरनेम और पासवर्ड भरें!");

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    alert(data.message);
                }
            });
        }
    </script>
</body>
</html>
